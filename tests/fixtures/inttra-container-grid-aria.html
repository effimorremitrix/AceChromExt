<!--
  Mock INTTRA container grid built as an ARIA grid with contenteditable cells,
  the other shape a framework grid commonly takes. Three rows. Nothing here
  was captured from the live portal.
-->
<div id="si">
  <ol class="steps"><li class="wizard-step active">Copy Container Details</li></ol>
  <h2>Copy Container Details</h2>
  <div role="grid" aria-label="Container Details">
    <div role="row">
      <div role="columnheader">Container Number</div>
      <div role="columnheader">Carrier Seal #</div>
      <div role="columnheader">Shipper Seal #</div>
      <div role="columnheader">Cargo Description</div>
      <div role="columnheader">HS Code</div>
    </div>
    <div role="row">
      <div role="gridcell" contenteditable="true"></div>
      <div role="gridcell" contenteditable="true"></div>
      <div role="gridcell" contenteditable="true"></div>
      <div role="gridcell" contenteditable="true"></div>
      <div role="gridcell" contenteditable="true"></div>
    </div>
    <div role="row">
      <div role="gridcell" contenteditable="true"></div>
      <div role="gridcell" contenteditable="true"></div>
      <div role="gridcell" contenteditable="true"></div>
      <div role="gridcell" contenteditable="true"></div>
      <div role="gridcell" contenteditable="true"></div>
    </div>
    <div role="row">
      <div role="gridcell" contenteditable="true"></div>
      <div role="gridcell" contenteditable="true"></div>
      <div role="gridcell" contenteditable="true"></div>
      <div role="gridcell" contenteditable="true"></div>
      <div role="gridcell" contenteditable="true"></div>
    </div>
  </div>
</div>
