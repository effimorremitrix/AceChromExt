# CI for ACE Helper.
#
# Three jobs, deliberately separate so a red run says *what* broke:
#   verify  - typecheck, unit tests, all six builds, generated files up to date (Node 20 and 22)
#   bundle  - supply-chain check on what actually ships in dist/, dist-inttra/,
#             dist-quickfill/ and dist-web/
#   smoke   - end-to-end in real Chrome against a mocked ACE host
#
# Deploying the operator dashboard is a separate, opt-in workflow
# (deploy-web.yml); nothing here needs a hosting credential.
#
# The unit suite includes tests/invariants.test.ts, tests/inttraInvariants.test.ts
# and tests/quickfillInvariants.test.ts, which assert the safety promises in
# docs/SECURITY.md against the source of each of the three extensions: no eval,
# no network calls, no automatic submission, no permission creep in a manifest.
# Those are the tests that must never be allowed to go unrun on a pull request.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build the unpacked extension
        run: npm run build

      - name: Build the INTTRA Helper
        run: npm run build:inttra

      - name: Build the Quickfill Helper
        # The third extension (dist-quickfill/): the only one that asks for both
        # portals' hosts, which is why it is built and checked on its own.
        run: npm run build:quickfill

      - name: Build the Quickfill playground
        # The same bundles under a manifest that matches local files only,
        # with the four mock AESDirect steps and the example workbook beside
        # it (dist-quickfill-playground/): the practice build, never a portal.
        run: npm run build:quickfill:playground

      - name: Build the QuickBooks companion
        # Separate output (dist-companion/), separate program: the bundle check
        # below is about dist/ only. Building it here catches a companion that
        # typechecks but does not bundle.
        run: npm run build:companion

      - name: The companion runs
        run: node dist-companion/ace-export.mjs --help > /dev/null

      - name: Build the operator dashboard
        # A static page (dist-web/): no server, no binding. The bundle job
        # below checks it against an empty host allowlist.
        run: npm run build:web

      - name: Generated files are up to date
        # The import template and the icons are generated, deterministic, and
        # committed. Regenerating them must be a no-op, or the committed copy
        # has drifted from its generator.
        run: |
          npm run template
          npm run icons
          npm run icons:inttra
          npm run icons:quickfill
          if ! git diff --exit-code -- templates extension/icons inttra-extension/icons quickfill-extension/icons; then
            echo "::error::templates/ or one of the three icons/ folders is out of date. Run 'npm run template', 'npm run icons', 'npm run icons:inttra' and 'npm run icons:quickfill', then commit the result."
            exit 1
          fi

      - name: Upload the unpacked extension
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: ace-helper-unpacked
          path: dist/
          retention-days: 14

      - name: Upload the ACE Helper playground
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: ace-playground-unpacked
          path: dist-ace-playground/
          retention-days: 14

      - name: Upload the unpacked INTTRA Helper
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: inttra-helper-unpacked
          path: dist-inttra/
          retention-days: 14

      - name: Upload the unpacked Quickfill Helper
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: quickfill-helper-unpacked
          path: dist-quickfill/
          retention-days: 14

      - name: Upload the Quickfill playground
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: quickfill-playground-unpacked
          path: dist-quickfill-playground/
          retention-days: 14

      - name: Upload the operator dashboard
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: operator-dashboard-static
          path: dist-web/
          retention-days: 14

  bundle:
    name: Bundle supply-chain check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: No eval, no network APIs, no unexpected hosts in dist/
        run: npm run check:bundle

      - run: npm run build:inttra

      - name: The same check on dist-inttra/, against the INTTRA host allowlist
        run: npm run check:bundle:inttra

      - run: npm run build:quickfill

      - name: The same check on dist-quickfill/, against both portals' hosts
        run: npm run check:bundle:quickfill

      - run: npm run build:quickfill:playground

      - name: The same check on the playground build, whose scripts are the same bundles
        run: npm run check:bundle:quickfill:playground

      - run: npm run build:web

      - name: The same check on dist-web/, allowing no host at all
        run: npm run check:bundle:web

  smoke:
    name: End-to-end (real Chrome, mocked ACE host)
    runs-on: ubuntu-latest
    env:
      # Pinned so CI is reproducible. Bump deliberately, and re-run the smoke
      # test locally against the same version before doing so.
      CHROME_VERSION: '141.0.7390.54'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Cache Chrome for Testing
        id: cache-chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/chrome-for-testing
          key: chrome-for-testing-${{ env.CHROME_VERSION }}-linux64

      - name: Install Chrome for Testing
        # NOT the runner's branded Google Chrome. Branded Chrome 137+ disables
        # the --load-extension switch, so the extension silently never loads
        # and the smoke test times out waiting for its service worker. Chrome
        # for Testing is the supported automation build, and pinning it also
        # stops a runner image bump from changing the browser under us.
        run: |
          set -euo pipefail
          dest="$HOME/.cache/chrome-for-testing/$CHROME_VERSION"
          if [ ! -x "$dest/chrome-linux64/chrome" ]; then
            mkdir -p "$dest"
            url="https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip"
            echo "Downloading $url"
            curl -fsSL --retry 3 --retry-delay 5 -o /tmp/chrome-for-testing.zip "$url"
            unzip -q /tmp/chrome-for-testing.zip -d "$dest"
          fi
          echo "CHROME_PATH=$dest/chrome-linux64/chrome" >> "$GITHUB_ENV"
          "$dest/chrome-linux64/chrome" --version

      - name: End-to-end smoke test
        run: npm run smoke
